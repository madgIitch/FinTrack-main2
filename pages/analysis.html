<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack - Analysis</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/analysis.css" />
  <script src="../js/apexcharts.min.js" defer></script>
  <script type="module" src="../js/analysis.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <button id="close-sidebar" class="close-btn">&times;</button>
      <h2>Menú</h2>
      <ul>
        <li><a href="profile.html" class="sidebar-btn">Perfil</a></li>
        <li><a href="notifications.html" class="sidebar-btn">Notificaciones</a></li>
        <li><button id="logout-link" class="sidebar-btn">Cerrar Sesión</button></li>
      </ul>
    </aside>

    <!-- Header -->
    <header class="header">
      <button id="open-sidebar" class="menu-btn"><i class="material-icons">menu</i></button>
      <h1 class="page-title">Analysis</h1>
      <div class="header-right">
        <a href="notifications.html" class="notification-button" aria-label="Notificaciones">
          <i class="material-icons">notifications</i>
        </a>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="analysis-fullscreen">
      <!-- Filtro de pestañas y periodo -->
      <div class="filter-card">
        <div class="filters">
          <button class="filter-btn active" data-filter="overview">General</button>
          <button class="filter-btn" data-filter="growth">Crecimiento</button>
          <button class="filter-btn" data-filter="compare">Comparación</button>
        </div>
        <div class="period-select-wrapper">
          <select id="period-select" class="period-select">
            <option value="week">Esta Semana</option>
            <option value="month" selected>Este Mes</option>
            <option value="year">Este Año</option>
          </select>
        </div>
      </div>

      <!-- Panel: General -->
      <div id="panel-overview" class="tab-panel active">
        <section class="kpi-row">
          <div class="card kpi-card">
            <h2>Ingresos</h2>
            <p id="kpi-revenue" class="kpi-value">€0</p>
            <p id="kpi-revenue-change" class="kpi-change">+0% vs anterior mes</p>
          </div>
          <div class="card kpi-card">
            <h2>Gastos</h2>
            <p id="kpi-spend" class="kpi-value">€0</p>
            <p id="kpi-spend-change" class="kpi-change">+0% vs anterior mes</p>
          </div>
        </section>

        <section class="charts-row">
          <div class="card chart-card" id="trendChart"></div>
          <div class="card chart-card" id="barChart"></div>
          <div class="card chart-card" id="pieChart"></div>
        </section>
      </div>

      <!-- Panel: Crecimiento -->
      <div id="panel-growth" class="tab-panel">
        <section class="kpi-row">
          <div class="card kpi-card">
            <h2>Crecimiento Ingresos</h2>
            <p id="kpi-growth-revenue" class="kpi-value">0%</p>
          </div>
          <div class="card kpi-card">
            <h2>Crecimiento Gastos</h2>
            <p id="kpi-growth-spend" class="kpi-value">0%</p>
          </div>
          <div class="card kpi-card">
            <h2>Mes más Ahorrador</h2>
            <p id="kpi-best-month" class="kpi-value">---</p>
          </div>
        </section>

        <section class="charts-row">
          <div class="card chart-card" id="growthChart"></div>
          <div class="card chart-card" id="categoryTrendChart"></div>
        </section>
      </div>

      <!-- Panel: Comparación -->
      <div id="panel-compare" class="tab-panel">
        <p style="padding: 1rem;">Próximamente: comparación de meses.</p>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item"><i class="material-icons">home</i><span>Home</span></a>
      <a href="transactions.html" class="nav-item"><i class="material-icons">swap_horiz</i><span>Transactions</span></a>
      <a href="analysis.html" class="nav-item active"><i class="material-icons">pie_chart</i><span>Analysis</span></a>
    </nav>
  </div>
</body>
</html>
