<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack - Notificaciones</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../css/notifications.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script type="module" src="../js/notifications.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="toolbar">
      <button id="back-button" class="icon-button" aria-label="Volver">
        <span class="material-icons">arrow_back</span>
      </button>
      <h1 class="title">Notificaciones</h1>
    </div>
  </header>

  <main class="container">
    <!-- Pestañas de filtrado -->
    <div class="notification-tabs">
      <button class="tab-button active" data-type="all">Todo</button>
      <button class="tab-button" data-type="alert">Alertas</button>
      <button class="tab-button" data-type="report">Informes</button>
    </div>

    <!-- Lista de notificaciones dinámicas -->
    <ul class="notifications-list">
      <!-- Las notificaciones se insertan dinámicamente desde notifications.js -->
    </ul>
  </main>
</body>
</html>
